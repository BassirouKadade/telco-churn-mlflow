stages:
  download:
    cmd: python src/download.py
    deps:
      - src/download.py
    outs:
      - data/raw/telco_churn.csv

  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
      - data/raw/telco_churn.csv
    params:
      - prepare
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed/train.csv
      - data/processed/test.csv
    params:
      - train
    metrics:
      - metrics.json:
          cache: false
